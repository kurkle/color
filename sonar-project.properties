sonar.projectKey=kurkle_color
sonar.organization=kurkle

# This is the name and version displayed in the SonarCloud UI.
sonar.projectName=color

# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
sonar.sources=src/,scripts/,docs/,bench/,.github/workflows
sonar.tests=src/,test/
sonar.test.inclusions=**/*.test.ts,**/*.test.js

sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Build and maintenance scripts, the documentation site and the benchmarks are analysed for issues but have no unit tests.
sonar.coverage.exclusions=scripts/**,docs/**,bench/**
# docs/src/generated is written by docs/scripts/write-docs-version.cjs at build time.
sonar.exclusions=docs/src/generated/**

# The floating v1 tag is deliberate: it is how a fix in kurkle/configs reaches
# every repository without a pull request in each one. Pinning a commit SHA
# would defeat that mechanism.
sonar.issue.ignore.multicriteria=e1,e2,e3,e4
sonar.issue.ignore.multicriteria.e1.ruleKey=githubactions:S7637
sonar.issue.ignore.multicriteria.e1.resourceKey=.github/workflows/*.yml

# The benchmark suites run one after another on purpose: parallel runs would distort timings and memory.
sonar.issue.ignore.multicriteria.e2.ruleKey=javascript:S9382
sonar.issue.ignore.multicriteria.e2.resourceKey=bench/compare.js

# The benchmark measures the global parseInt, and its history is compared across commits, so the measured code must not change.
sonar.issue.ignore.multicriteria.e3.ruleKey=javascript:S7773
sonar.issue.ignore.multicriteria.e3.resourceKey=bench/hexbench.js

# Printing the normalised dataset to stdout is the tool's output; the input is the public benchmark data.
sonar.issue.ignore.multicriteria.e4.ruleKey=jssecurity:S8689
sonar.issue.ignore.multicriteria.e4.resourceKey=bench/scripts/normalize.mjs
